; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
;platform = espressif32@^7.0.1
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
;board = nodemcu-32s
board = esp32dev
board_build.filesystem = littlefs 
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    powerbroker2/ELMduino@^3.4.1
    lvgl/lvgl@^9.5.0

build_flags =
;${env.build_flags}
    -D ESP32_3_X_COMPAT=1
    -I include
    -D LV_CONF_SKIP=1
    -D LV_COLOR_DEPTH=16
    -D LV_COLOR_16_SWAP=0
    -D LV_FONT_MONTSERRAT_14=1
    -D LV_FONT_MONTSERRAT_18=1
    -D LV_FONT_MONTSERRAT_24=1
    -D LV_FONT_MONTSERRAT_48=1
    ; Force every TU (including the TFT_eSPI library itself) to load our
    ; include/User_Setup.h before TFT_eSPI.h, avoiding include-path ambiguity.
    -D USER_SETUP_LOADED=1
    -include include/User_Setup.h
    -D LV_MEM_CUSTOM=1
    -D LV_MEM_SIZE="(32 * 1024U)"
     ; Optimization: remove unused LVGL parts
    -D LV_USE_FS_IF=0
    -D LV_USE_SNAPSHOT=0
    -D LV_USE_DRAW_SW_ASM_NEON=0
    -D LV_USE_DRAW_SW_ASM_CUSTOM=0